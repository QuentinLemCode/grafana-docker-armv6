name: Build Grafana ARMv6 (weekly)

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Force build and push even if tag exists'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 3 * * 0' # Weekly, Sundays 03:00 UTC

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install deps
        run: npm ci

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Build tools
        run: npm run build

      - name: Run unit tests (download)
        run: npm test

      - name: Get latest
        id: latest
        run: |
          node dist/index.js --print-json > latest.json
          echo "version=$(jq -r .version latest.json)" >> $GITHUB_OUTPUT
          echo "url=$(jq -r .url latest.json)" >> $GITHUB_OUTPUT

      - name: Check if tag exists on Docker Hub
        id: tagcheck
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -e
          if [ -z "$DOCKERHUB_USERNAME" ]; then echo "Missing DOCKERHUB_USERNAME secret"; exit 1; fi
          repo="$DOCKERHUB_USERNAME/grafana-armv6"
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://hub.docker.com/v2/repositories/${repo}/tags/${{ steps.latest.outputs.version }}/")
          if [ "$code" = "200" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Download tarball
        if: steps.tagcheck.outputs.exists == 'false' || inputs.force == true
        run: node dist/index.js --download

      - name: Setup QEMU
        if: steps.tagcheck.outputs.exists == 'false' || inputs.force == true
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        if: steps.tagcheck.outputs.exists == 'false' || inputs.force == true
        uses: docker/setup-buildx-action@v4

      - name: Docker login
        if: steps.tagcheck.outputs.exists == 'false' || inputs.force == true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Find tarball name
        if: steps.tagcheck.outputs.exists == 'false' || inputs.force == true
        id: tarball
        run: |
          set -e
          t=$(ls tmp/*.tar.gz | head -n1)
          echo "file=$t" >> $GITHUB_OUTPUT
          echo "name=$(basename "$t")" >> $GITHUB_OUTPUT

      # Build a local image load step is intentionally removed along with runtime test

      - name: Build and push
        if: steps.tagcheck.outputs.exists == 'false' || inputs.force == true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          repo="$DOCKERHUB_USERNAME/grafana-armv6"
          docker buildx build \
            --platform linux/arm/v6 \
            --build-arg GRAFANA_TARBALL=${{ steps.tarball.outputs.name }} \
            -t "$repo:${{ steps.latest.outputs.version }}" \
            -t "$repo:latest" \
            --push .

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/grafana-armv6
          short-description: ${{ github.event.repository.description }}
          readme-filepath: ./DOCKERHUB.md

      - name: Outcome
        run: |
          if [ "${{ steps.tagcheck.outputs.exists }}" = "true" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "Image already up-to-date for version ${{ steps.latest.outputs.version }}."
          else
            echo "Pushed image for version ${{ steps.latest.outputs.version }}."
          fi

