name: Auto-merge Dependabot PRs

on:
  workflow_run:
    workflows: [ "PR CI" ]
    types: [ completed ]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Get PR number
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const prs = context.payload.workflow_run.pull_requests;
            if (!prs || prs.length === 0) {
              core.setFailed('No pull requests associated with this workflow_run.');
              return;
            }
            core.setOutput('number', String(prs[0].number));

      - name: Ensure PR is from Dependabot
        id: dep
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = Number(core.getInput('number')) || Number(process.env.PR_NUMBER || '${{ steps.pr.outputs.number }}');
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const ok = pr.user?.login === 'dependabot[bot]';
            core.setOutput('ok', ok ? 'true' : 'false');

      - name: Merge PR (squash)
        if: steps.dep.outputs.ok == 'true'
        run: gh pr merge -R "${{ github.repository }}" --squash --auto ${{ steps.pr.outputs.number }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

